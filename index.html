<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Untitled Voxel Game</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #87ceeb;
      }
      canvas {
        display: block;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font-family: system-ui, sans-serif;
        cursor: pointer;
        user-select: none;
      }
      #overlay h1 {
        margin: 0;
        font-size: 32px;
      }
      #overlay p {
        margin: 0;
        opacity: 0.85;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font: 24px monospace;
        pointer-events: none;
        text-shadow: 0 0 2px #000;
      }
    </style>
  </head>
  <body>
    <div id="crosshair">+</div>
    <div id="overlay">
      <h1>Click to play</h1>
      <p>WASD move · Mouse look · Space jump · Esc pause</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
