<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Untitled Voxel Game</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #87ceeb;
      }
      canvas {
        display: block;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font-family: system-ui, sans-serif;
        cursor: pointer;
        user-select: none;
      }
      #overlay h1 {
        margin: 0;
        font-size: 32px;
      }
      #overlay p {
        margin: 0;
        opacity: 0.85;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font: 24px monospace;
        pointer-events: none;
        text-shadow: 0 0 2px #000;
      }
      #fps {
        position: fixed;
        left: 8px;
        top: 8px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font: 13px/1.4 monospace;
        white-space: pre;
        border-radius: 4px;
        pointer-events: none;
        z-index: 1;
      }
      #saved {
        position: fixed;
        right: 8px;
        top: 8px;
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font: 14px system-ui, sans-serif;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #saved.show {
        opacity: 1;
      }
      #reset {
        margin-top: 12px;
        padding: 8px 16px;
        font: 14px system-ui, sans-serif;
        color: #fff;
        background: rgba(160, 40, 40, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 6px;
        cursor: pointer;
      }
      #reset:hover {
        background: rgba(190, 50, 50, 0.95);
      }
    </style>
  </head>
  <body>
    <div id="crosshair">+</div>
    <div id="hotbar"></div>
    <div id="fps"></div>
    <div id="saved">✓ Saved</div>
    <div id="overlay">
      <h1>Click to play</h1>
      <p>WASD move · Mouse look · Space jump · Esc pause</p>
      <p>Left click break · Right click place · 1–9 or scroll to pick block</p>
      <p>Your changes save automatically.</p>
      <button id="reset" type="button">Reset world</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
